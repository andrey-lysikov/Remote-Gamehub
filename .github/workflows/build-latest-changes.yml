name: Build latest changes

on:
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Build the server
        shell: pwsh
        run: ./build.ps1

      - name: Name the download
        id: name
        shell: pwsh
        run: |
          $sha = '${{ github.sha }}'.Substring(0, 7)
          "artifact=Remote-Gamehub-${{ github.ref_name }}-$sha" -replace '/', '-' >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: build/Remote-Gamehub.exe
          if-no-files-found: error
          retention-days: 14
